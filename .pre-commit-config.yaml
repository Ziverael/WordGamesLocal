default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v2.3.0
  hooks:
    - id: check-yaml
    - id: end-of-file-fixer
    - id: trailing-whitespace
    - id: check-added-large-files
      args: ['--maxkb=150']

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.17
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format

- repo: local
  hooks:
    - id: no-untracked-python
      name: Block untracked .py files (they would leak into mypy/pytest)
      entry: sh -c 'f=$(git ls-files --others --exclude-standard -- "*.py"); [ -z "$f" ] || { echo "$f"; echo "git add or stash them first"; exit 1; }'
      language: system
      pass_filenames: false
      always_run: true
    - id: mypy
      name: mypy
      entry: uv run --no-sync mypy
      language: system
      pass_filenames: false
      types: [python]
    - id: pytest
      name: pytest (container)
      entry: just test
      language: system
      pass_filenames: false
      types: [python]
      stages: [pre-push]
