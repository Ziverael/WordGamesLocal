name: CI

on:
  pull_request:
    branches: [ main ]

env:
  UV_NO_SYNC: 1

permissions:
  contents: read
  checks: write
  issues: write
  pull-requests: write

jobs:
  lint:
    name: Lint (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Setup dependencies
        run: uv sync --dev --locked

      - name: Run lint
        run: |
          uv run ruff check . || ERROR=$?
          uv run ruff format --check . || ERROR=$?
          uv run mypy --incremental --show-error-codes --pretty || ERROR=$?
          exit ${ERROR}

      # Kivy widgets need a window; Xvfb provides an invisible display.
      - name: Install virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libegl1

      - name: Run tests
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1280x800x24" \
          uv run pytest \
            --cov word_games \
            --junitxml=coverage/junit.xml \
            --cov-report html:coverage/htmlcov \
            --cov-report xml:coverage/coverage.xml \
            --cache-clear \
            --pyargs ./tests
        env:
          KIVY_NO_ARGS: 1

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: |
            coverage/junit.xml
