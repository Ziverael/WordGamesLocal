[project]
name = "word_games_local"
version = "1.0.0"
description = "Offline word games: teachers author assignments, students import and play them."
authors = [{name="ZiveRael", email="papeernscal@gmail.com"}]
readme = "README.md"
dependencies = [
    "kivy==2.3.1",
    "platformdirs==4.14.5",
    "pydantic==2.13.4",
    "pydantic-settings>=2.16.3",
    "tomli-w==1.2.0",
]
requires-python=">= 3.12, <3.13"

[project.scripts]
word-games-teacher = "word_games.teacher.main:run"
word-games-student = "word_games.student.main:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["word_games"]

[tool.uv]
package = true


[dependency-groups]
dev = [
    "ipykernel==6.31.0", # Vs-code extension bug https://stackoverflow.com/questions/79788502/jupyter-notebook-extension-visual-studio-code-stuck-connecting-to-kernel in 7.1.0
    "mypy==2.1.0",
    "pdbpp==0.12.1",
    "polyfactory>=3.3.0",
    "pre-commit==4.6.0",
    "pytest==9.0.2",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "ruff==0.15.17",
    "scalene==2.3.0",
]
package = [
    "pyinstaller==6.22.3",
]


[tool.mypy]
python_version = "3.12"
files = ["word_games", "tests"]
mypy_path = "word_games"
ignore_missing_imports = true
plugins = [
    "pydantic.mypy",
]
warn_unused_configs = true
show_error_context = true
show_column_numbers = true
pretty = true


[tool.ruff]
target-version = "py312"
line-length = 80
indent-width = 4

[tool.ruff.lint]
select = ["ALL"]
unfixable = ["F841"]
ignore = [ "ANN", "TD", "N803", "N805", "N806", "COM812", "ISC001", "E501", "D", "RUF002"]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.pydocstyle]
convention = "numpy"


[tool.ruff.lint.per-file-ignores]
"design/*.py" = [
    "INP001",  # standalone scripts, not a package
]
"tests/**/*.py" = [
    "ARG001",  # Unused function argument:
    "DTZ001",  # The use of `datetime.datetime()` without `tzinfo` argument is not allowed
    "EM101",   # Exception must not use a string literal, assign to variable first
    "FBT001",  # Boolean-typed positional argument in function definition
    "PLR0913", # Too many arguments in function definition
    "PLR2004", # Magic value used in comparison, consider replacing x with a constant variable
    "S101",    # Use of assert
    "SLF001",  # Private member accessed
    "TRY003",  # Avoid specifying long messages outside the exception class
]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party"
]
lines-after-imports = 2

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.flake8-annotations]
# Configure type annotation requirements (PEP 484 compliance)
allow-star-arg-any = false
ignore-fully-untyped = false
suppress-dummy-args = true
suppress-none-returning = true


[tool.pytest.ini_options]
minversion = "9.0"
junit_family = "xunit2"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
testpaths = "tests"
strict_markers = true
markers = [
    "slow: long-running test",
    "atomic: single atomic function",
    "controller: controller (business logic) function",
]

[tool.coverage.report]
skip_covered = true
skip_empty = true
exclude_lines = [# list of regexes
    "pragma: no cover",
    "^if __name__ == \"__main__\":",
    "@abstractmethod",
    "@abc.abstractmethod",
    '^\s+\.\.\.\s*$',
    '.*\): \.\.\.$',
    '^\s+pass\s*$',
    "^if TYPE_CHECKING:",
    "^if typing.TYPE_CHECKING:",
]

[tool.coverage.run]
branch = true
source = ["word_games"]
omit = [  # Kivy entry points need a display
    "word_games/teacher/main.py",
    "word_games/student/main.py",
]
